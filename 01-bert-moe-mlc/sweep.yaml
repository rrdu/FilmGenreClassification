method: random
run_cap: 5
metric:
  name: val_f1_macro
  goal: maximize
program: ./train.py
early_terminate:
  type: hyperband
  min_iter: 3

parameters:
  # --- Fixed Values (Moved here so ${args} passes them automatically) ---
  seed:
    value: 42
  max_epochs:
    value: 20
  batch_size:
    value: 64
  finetune_backbone:
    value: 0

  # --- Hyperparameters to Tune ---
  learning_rate:
    distribution: log_uniform_values
    min: 1e-5
    max: 5e-3

  num_experts:
    distribution: categorical
    values: [8, 16]

  top_k:
    distribution: categorical
    values: [1, 2, 3]

  aux_loss_weight:
    distribution: log_uniform_values
    min: 1e-3
    max: 1e-1

  expert_hidden_dim:
    distribution: categorical
    values: [128, 256]

  warmup_frac:
    distribution: uniform
    min: 0.01
    max: 0.2
    
  # threshold:  <-- SEE NOTE BELOW
  #   distribution: uniform
  #   min: 0.3
  #   max: 0.7

command:
  - ${env}
  - python
  - ${program}
  - --wandb_run
  - --data_dir
  - ../data/imdb_arh_trimmed
  - --train_file
  - imdb_arh_train.csv
  - --val_file
  - imdb_arh_val.csv
  - --project
  - MovieGenreMultilabelMoE
  - --num_workers
  - "4"
  - ${args}   # <--- This handles ALL parameters defined above automatically
  - --no_pos_weight