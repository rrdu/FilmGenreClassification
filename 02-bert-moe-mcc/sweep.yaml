method: random
run_cap: 5
metric:
  name: val_acc
  goal: maximize
program: ./train.py
early_terminate:
  type: hyperband
  min_iter: 3

parameters:
  seed:
    distribution: q_uniform
    min: 1
    max: 3
    q: 1
  learning_rate:
    distribution: log_uniform_values
    min: 1e-5
    max: 5e-3
  batch_size:
    value: 64
  num_experts:
    distribution: categorical
    values: [4, 6, 8]
  top_k:
    distribution: categorical
    values: [1, 2]
  aux_loss_weight:
    distribution: log_uniform_values
    min: 1e-2
    max: 1.0
  expert_hidden_dim:
    distribution: categorical
    values: [64, 128, 256]
  encoder_emb_dim:
    distribution: categorical
    values: [128, 256]
  warmup_frac:
    distribution: uniform
    min: 0.01
    max: 0.2
  max_epochs:
    value: 20

command:
  - ${env}
  - python
  - ${program}
  - --wandb_run
  - --data_dir=../data/imdb_arh_trimmed
  - --train_file=imdb_arh_train.csv
  - --val_file=imdb_arh_val.csv
